<!DOCTYPE html>
<html lang="pt">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azul Admin</title>
  <meta name="theme-color" content="#0b3d91">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Azul Admin">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="Assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="Assets/icon-192.png">
  <link rel="stylesheet" href="CSS/admin.css">
</head>
<body>
  <main class="admin-shell">
    <div id="admin-loading" class="admin-loading" role="status" aria-live="polite">
      <span class="admin-loading-spinner" aria-hidden="true"></span>
      <strong>A verificar sessao...</strong>
    </div>

    <section id="admin-login" class="admin-login-card" hidden>
      <h1>Azul Admin</h1>
        <input id="admin-email" type="email" placeholder="Email admin">
        <input id="admin-password" type="password" placeholder="Palavra-passe admin">
        <button onclick="loginAdmin()">Entrer</button>
      <div id="admin-login-msg" class="admin-msg"></div>
    </section>

    <section id="admin-panel" class="admin-panel" hidden>
      <header class="admin-header">
        <div>
          <h1>Gestao de licencas</h1>
          <p>Criar, desativar e reativar acessos dos clientes.</p>
        </div>

        <button class="danger-btn" onclick="logoutAdmin()">Terminar sessao</button>
      </header>

      <section class="admin-grid">
        <div class="admin-card">
          <h2>Nova licenca</h2>
          
          <label>Expiration</label>
          <input id="org-expires" type="date">
          
          <label>Notes</label>
          <input id="org-notes" type="text" placeholder="Ex: pagamento WhatsApp, cliente X...">
          
          <label>Chave gerada</label>
          <input id="org-license" type="text" placeholder="A chave aparece aqui" disabled>
          
          <button class="primary-btn" onclick="createOrganization()">Gerar licenca</button>
          <div id="admin-form-msg" class="admin-msg"></div>
        </div>

        <div class="admin-card">
          <div class="list-head">
            <h2>Clients</h2>
            <button onclick="loadOrganizations()">Atualizar</button>
          </div>

          <input id="admin-search" type="text" placeholder="Pesquisar..." oninput="renderOrganizations()">

          <div id="organizations-list" class="org-list">
            <div class="empty">A carregar...</div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="JS/supabase.js"></script>
  <script src="JS/admin.js"></script>
  <script src="JS/pwa.js"></script>
</body>
</html>
