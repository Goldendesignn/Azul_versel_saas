<!DOCTYPE html>
<html>
  <head>
  <script>
    if (localStorage.getItem("azul_organization_id")) {
      window.location.replace("core.html");
    }
  </script>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azul Gestao</title>
  <meta name="theme-color" content="#0b3d91">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Azul">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="Assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="Assets/icon-192.png">
  <link rel="stylesheet" href="CSS/login.css">
</head>
  <body>
    <div class="cont-login">
      <h1 style="text-align: center;">Registo</h1>
      <div class="cont-input-login">
        <input type="text" placeholder="Nome" id="nom" autocomplete="name">
        <input type="tel" placeholder="Telefone" id="numero" autocomplete="tel">
        <input type="email" placeholder="Email opcional" id="email" autocomplete="email">
        <input type="text" placeholder="Chave de licenca" id="license" autocomplete="off" oninput="formatLicenseInput(this)">
      </div>
      <div id="login-message" class="login-message"></div>
      <button id="login-btn" onclick="login()">Ativar</button>
    </div>
  </body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/supabase.js"></script>
<script src="JS/login.js"></script>
<script src="JS/pwa.js"></script>
</html>
